# differently than other devices, at connect time we look for a specific 
#  hardware Id. Hence PhysicalId is specified at object creation time and not
#  later at connection time.
PhysicalId  : QHY600M-428193499677ec3fd

Verbose     : true

BaseDir          : '/last07e/data2/archive' # The (existing) directory.
DataDir          : 'new' # The (new) directory where the regular images will be stored.
LogFileDir       : '/last07e/data2/archive/log/' # The directory wehere the log files will be stored.

DarkDBDir        : '/last07e/data/ServiceImages/darkDB' # The directory where "Dark" images will be stored.
FlatDBDir        : '/last07e/data/ServiceImages/flatDB' # The directory where "Flat" images will be stored.
DarkDB           : 'darkDB.mat'
FlatDB           : 'flatDB.mat'

Filter           : 'clear'

CameraNumber     : 2
CameraPos        : 'SE'
TelescopeOffset  : [1.0, -1.5]

# Keys to be copied verbatim in FITS header (remember to keep the strict
#  format [ [FITSKEY,value],... ] )
ExtraFITSHeader        : [[OPT_CLN,2460993,Last time optics was cleaned, JD]]
