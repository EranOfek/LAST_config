# differently than other devices, at connect time we look for a specific 
#  hardware Id. Hence PhysicalId is specified at object creation time and not
#  later at connection time.
PhysicalId  : QHY600M-85aa2e4e9dc37cfe7

Verbose     : true

BaseDir          : '/last21w/data1/archive' # The (existing) directory.
DataDir          : 'new' # The (new) directory where the regular images will be stored.
LogFileDir       : '/last21w/data1/archive/log/' # The directory wehere the log files will be stored.

DarkDBDir        : '/last21w/data/ServiceImages/darkDB' # The directory where "Dark" images will be stored.
FlatDBDir        : '/last21w/data/ServiceImages/flatDB' # The directory where "Flat" images will be stored.
DarkDB           : 'darkDB.mat'
FlatDB           : 'flatDB.mat'

Filter           : 'clear'

CameraNumber     : 3
CameraPos        : 'SW'
TelescopeOffset  : [0.0, 0.0]

# Keys to be copied verbatim in FITS header (remember to keep the strict
#  format [ [FITSKEY,value],... ] )
ExtraFITSHeader        : [[OPT_CLN,0,Last time optics was cleaned, JD]]

